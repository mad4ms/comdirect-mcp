name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The server is read-only by design: features that place orders or transfer money will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Which comdirect API endpoint or MCP feature would help, if you know it.
